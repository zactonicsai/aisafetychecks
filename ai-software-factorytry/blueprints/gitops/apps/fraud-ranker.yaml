# Desired state. Same file for every cluster; only the overlay changes replicas/GPU.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-ranker
  namespace: ns-stage
  labels:
    forge.aether.io/app: fraud-ranker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraud-ranker
  template:
    metadata:
      labels:
        app: fraud-ranker
    spec:
      containers:
        - name: model
          image: harbor.forge.internal/models/fraud-ranker@sha256:9f3a1c
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 1Gi
              cpu: "1"
---
# Promotion = change the digest in Git, never mutate the tag.
# Rollback = revert this file to the previous SHA.
