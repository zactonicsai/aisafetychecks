---
# Harden / configure a golden Linux workbench (VM or image build host).
# Workspaces should normally be containers FROM images/workbench/Containerfile.
- name: Aether Forge workbench
  hosts: workbenches
  become: true
  vars:
    nexus_apt: "https://nexus.forge.internal/repository/apt-proxy"
    harbor: "harbor.forge.internal"
  tasks:
    - name: Only approved package source
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/forge.list
        content: "deb {{ nexus_apt }} stable main\n"

    - name: Core toolchains
      ansible.builtin.apt:
        name:
          - openjdk-21-jdk
          - gcc
          - g++
          - cmake
          - ninja-build
          - python3
          - python3-venv
          - golang
          - rustc
          - cargo
          - git
          - make
          - podman
          - buildah
        state: present
        update_cache: true

    - name: pip/uv index
      ansible.builtin.copy:
        dest: /etc/pip.conf
        content: |
          [global]
          index-url = https://nexus.forge.internal/repository/pypi-proxy/simple
          extra-index-url = https://nexus.forge.internal/repository/pypi-hosted/simple

    - name: Cosign + syft placeholders
      ansible.builtin.debug:
        msg: "Install cosign/syft/grype from Harbor tooling repo in real environments."
