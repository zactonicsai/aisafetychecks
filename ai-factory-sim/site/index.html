<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory floor: AI model testing factory, simulated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Tokens. Machine-enamel green, shop-floor grey, hazard yellow for the one thing that matters: where you are on the line. */
:root{
  --floor:#E4E9E5; --panel:#F6F8F6; --ink:#15221E; --steel:#55655F; --rule:#C3CDC7;
  --enamel:#1F5A4B; --on-enamel:#F6F8F6; --hazard:#F2B824; --on-hazard:#15221E; --stop:#B5382A;
  --good-bg:#D5E8DD; --bad-bg:#F2D9D4; --warn-bg:#FAEBBB; --plain-bg:#DDE3DF;
  --body:"Barlow","Avenir Next","Segoe UI",system-ui,sans-serif;
  --cond:"Barlow Condensed","Avenir Next Condensed","Arial Narrow",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --pad:clamp(1rem,4vw,2.5rem);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --floor:#0F1714; --panel:#17211D; --ink:#E2EAE5; --steel:#9AABA5; --rule:#2B3A34;
    --enamel:#7DC8AB; --on-enamel:#0F1714; --stop:#EE8272;
    --good-bg:#1C3A2E; --bad-bg:#47221C; --warn-bg:#43381A; --plain-bg:#25322D;
  }
}
:root[data-theme="dark"]{
  --floor:#0F1714; --panel:#17211D; --ink:#E2EAE5; --steel:#9AABA5; --rule:#2B3A34;
  --enamel:#7DC8AB; --on-enamel:#0F1714; --stop:#EE8272;
  --good-bg:#1C3A2E; --bad-bg:#47221C; --warn-bg:#43381A; --plain-bg:#25322D;
}
*{box-sizing:border-box}
body{margin:0;background:var(--floor);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-text-size-adjust:100%}
a{color:inherit}
:focus-visible{outline:3px solid var(--hazard);outline-offset:2px}
code,pre,.mono{font-family:var(--mono);font-size:.84em}
pre{margin:.5rem 0 0;padding:.7rem .8rem;background:var(--plain-bg);border-radius:3px;overflow-x:auto;white-space:pre}
.muted{color:var(--steel)}

/* Header */
.bar{display:flex;flex-wrap:wrap;gap:.5rem 1.5rem;align-items:center;justify-content:space-between;padding:.7rem var(--pad);background:var(--enamel);color:var(--on-enamel)}
.bar .title{font:700 1.55rem/1 var(--cond);letter-spacing:.01em}
.bar .sub{display:block;font:400 .82rem/1.3 var(--body);opacity:.85;margin-top:.15rem}
.who{display:flex;align-items:center;gap:.5rem;font-size:.88rem}
.who select{font:500 .9rem var(--body);padding:.3rem .4rem;border-radius:3px;border:0;background:var(--panel);color:var(--ink);max-width:14rem}

/* The line: the signature element. Stations are the navigation, the belt runs underneath. */
.line{display:flex;overflow-x:auto;background:var(--panel);scroll-snap-type:x proximity;scrollbar-width:thin}
.station{flex:0 0 9.6rem;scroll-snap-align:start;padding:.7rem .9rem .8rem;text-decoration:none;border-right:1px solid var(--rule)}
.station .n{display:block;font:700 1.6rem/1 var(--cond);color:var(--steel)}
.station .name{display:block;font:600 1.18rem/1.15 var(--cond);margin-top:.1rem}
.station .tool{display:block;font-size:.78rem;color:var(--steel);line-height:1.3}
.station .stat{display:block;font-size:.8rem;line-height:1.3;margin-top:.45rem}
.station:hover{background:var(--plain-bg)}
.station[aria-current="page"]{background:var(--hazard);color:var(--on-hazard)}
.station[aria-current="page"] .n,.station[aria-current="page"] .tool{color:var(--on-hazard)}
.lamp{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--enamel);margin-right:.35rem;outline:1px solid var(--panel)}
.lamp.warn{background:var(--hazard);outline-color:var(--on-hazard)}
.station[aria-current="page"] .lamp{background:var(--on-hazard)}
.belt{height:10px;background:repeating-linear-gradient(-45deg,var(--hazard) 0 12px,#15221E 12px 24px);background-size:34px 10px}
@media (prefers-reduced-motion:no-preference){.belt{animation:belt 1.4s linear 2}}
@keyframes belt{to{background-position:68px 0}}
@media (min-width:78rem){.line{display:grid;grid-template-columns:repeat(8,1fr)}.station:last-child{border-right:0}}

.services{display:flex;flex-wrap:wrap;gap:.2rem 1.2rem;padding:.6rem var(--pad);border-bottom:1px solid var(--rule);font-size:.92rem}
.services a{text-decoration:none;padding:.45rem 0;border-bottom:3px solid transparent}
.services a:hover{border-bottom-color:var(--rule)}
.services a[aria-current="page"]{border-bottom-color:var(--hazard);font-weight:600}

/* Views */
main{max-width:76rem;margin:0 auto;padding:1.4rem var(--pad) 4rem}
h1{font:700 clamp(1.9rem,5.5vw,2.7rem)/1.05 var(--cond);margin:.3rem 0 .5rem}
h2{font:600 1.4rem/1.2 var(--cond);margin:2.2rem 0 .5rem;padding-top:1rem;border-top:1px solid var(--rule)}
h3{font:600 1.05rem/1.3 var(--body);margin:1.2rem 0 .3rem}
p{margin:.4rem 0;max-width:68ch}
.lede{font-size:1.08rem}
.sim{font-size:.88rem;color:var(--steel)}
.scroll{overflow-x:auto;margin:.4rem 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
.wide table{min-width:44rem}
th{font-weight:600;color:var(--steel);text-align:left;white-space:nowrap}
th,td{padding:.42rem .9rem .42rem 0;vertical-align:top;border-bottom:1px solid var(--rule)}
td small{display:block;color:var(--steel);line-height:1.35}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;padding:0 .45rem;border-radius:3px;font-size:.8rem;font-weight:500;line-height:1.5;background:var(--plain-bg);white-space:nowrap}
.pill.good{background:var(--good-bg)} .pill.bad{background:var(--bad-bg)} .pill.warn{background:var(--warn-bg)}
td.pass{background:var(--good-bg)} td.fail{background:var(--bad-bg);font-weight:600}
td.pass,td.fail{padding-left:.5rem}
.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.8rem 2rem;margin:1rem 0}
.figures b{display:block;font:700 2rem/1.05 var(--cond)}
.figures span{font-size:.86rem;color:var(--steel)}
.plan{margin:.6rem 0}
.plan div{display:grid;grid-template-columns:8.5rem 1fr;gap:.2rem 1rem;padding:.5rem 0;border-bottom:1px solid var(--rule)}
.plan dt{font:600 1.08rem/1.3 var(--cond)} .plan dd{margin:0}
@media (max-width:34rem){.plan div{grid-template-columns:1fr}}
ul.feed{list-style:none;padding:0;margin:.4rem 0}
ul.feed li{padding:.45rem 0;border-bottom:1px solid var(--rule);max-width:80ch}
ul.feed .when{color:var(--steel);font-size:.84rem;margin-right:.5rem;white-space:nowrap}
details{border-bottom:1px solid var(--rule);padding:.5rem 0}
summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:.3rem .7rem;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:"+";font:700 1.1rem/1 var(--cond);width:.8rem;color:var(--steel)}
details[open]>summary::before{content:"\2212"}
.beads{display:inline-flex;gap:3px}
.bead{width:.75rem;height:.75rem;border-radius:2px;background:var(--enamel)}
.bead.failed{background:var(--stop)} .bead.flaky{background:var(--hazard)} .bead.skipped{background:transparent;outline:1px solid var(--steel);outline-offset:-1px}
.steps{margin:.5rem 0 .3rem 1.5rem;font-size:.88rem}
.steps li{margin:.25rem 0}
.actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}
.act{font:600 .93rem var(--body);padding:.55rem .9rem;border:0;border-radius:3px;background:var(--enamel);color:var(--on-enamel);cursor:pointer;text-align:left}
.act[data-allowed="false"]{background:transparent;color:var(--ink);outline:1px solid var(--steel);outline-offset:-1px}
.act small{display:block;font-weight:400;opacity:.85}
.filters{display:flex;flex-wrap:wrap;gap:.5rem 1rem;margin:.8rem 0;font-size:.9rem}
.filters select{font:inherit;padding:.25rem .4rem;border-radius:3px;border:1px solid var(--steel);background:var(--panel);color:var(--ink)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:1rem 2rem}
.charts figure{margin:0} .charts figcaption{font-size:.88rem;font-weight:600}
svg.chart{width:100%;height:auto;display:block}
.ch-line{fill:none;stroke:var(--enamel);stroke-width:2;stroke-linejoin:round}
.ch-limit{stroke:var(--stop);stroke-dasharray:5 4}
.ch-mark{stroke:var(--steel);stroke-dasharray:2 3}
.ch-text{fill:var(--steel);font:11px var(--body)}
.opt h3{margin-top:.8rem}
.opt ul{margin:.3rem 0;padding-left:1.2rem;max-width:80ch} .opt li{margin:.3rem 0}
dialog{border:0;border-radius:4px;padding:1.2rem 1.3rem;max-width:min(38rem,92vw);background:var(--panel);color:var(--ink);border-top:8px solid var(--enamel)}
dialog.denied{border-top-color:var(--stop)}
dialog::backdrop{background:rgba(10,18,15,.55)}
dialog h2{border:0;margin:0 0 .4rem;padding:0}
dialog form{margin-top:1rem;text-align:right}
</style>
</head>

tool": "argocd", "actor": "kai", "action": "deploy:prod", "target": "intent-classifier v4 -> prod", "result": "denied", "detail": "role viewer lacks deploy:prod"}, {"n": 156, "t": "Fri 09:44", "tool": "opentofu", "actor": "tom", "action": "infra:apply", "target": "eks-prod", "result": "denied", "detail": "role developer lacks infra:apply"}, {"n": 157, "t": "Fri 09:45", "tool": "keycloak", "actor": "ana", "action": "offboard", "target": "sam", "result": "ok", "detail": "disable account, end sessions"}, {"n": 158, "t": "Fri 09:49", "tool": "forgejo", "actor": "ana", "action": "offboard", "target": "sam", "result": "ok", "detail": "delete SSH keys and personal tokens"}, {"n": 159, "t": "Fri 09:52", "tool": "harbor", "actor": "ana", "action": "offboard", "target": "sam", "result": "ok", "detail": "revoke CLI secret"}, {"n": 160, "t": "Fri 09:53", "tool": "mlflow", "actor": "ana", "action": "offboard", "target": "sam", "result": "ok", "detail": "remove experiment permissions"}, {"n": 161, "t": "Fri 09:54", "tool": "argocd", "actor": "ana", "action": "offboard", "target": "sam", "result": "ok", "detail": "revoke API tokens"}, {"n": 162, "t": "Fri 09:57", "tool": "clouds", "actor": "ana", "action": "offboard", "target": "sam", "result": "ok", "detail": "remove federation bindings in all three"}, {"n": 163, "t": "Fri 09:59", "tool": "keycloak", "actor": "sam", "action": "login", "target": "realm factory", "result": "denied", "detail": "account disabled"}], "catalog": [{"id": "identity", "layer": "Sign-in and access", "job": "One login for every tool. Groups decide who can do what.", "pick": "Keycloak", "licence": "Apache-2.0", "options": [{"name": "Keycloak", "pros": "Mature OIDC and SAML, fine-grained groups, large community.", "cons": "Heaviest to run. Major upgrades arrive often and need care."}, {"name": "Authentik", "pros": "Friendlier admin UI. Built-in proxy for apps that have no SSO.", "cons": "Smaller ecosystem. Some features are enterprise-only."}, {"name": "Dex or Authelia", "pros": "Tiny footprint.", "cons": "No real user management: you still need a directory behind them."}], "gotchas": ["If the identity provider is down, nobody can log in anywhere. Run two replicas, back up its database, and keep one sealed break-glass admin account in each tool.", "Disabling a user does not revoke their SSH keys, personal tokens or robot accounts inside each tool. Offboarding must be a script that visits every tool.", "Many open-core tools charge for SSO or group sync. Check the free edition before adopting a tool.", "Keep the realm as code (keycloak-config-cli or the OpenTofu provider) so access changes are reviewed pull requests."]}, {"id": "source", "layer": "Code, reviews and packages", "job": "Git hosting, pull requests, and the package registries for every language.", "pick": "Forgejo", "licence": "GPL-3.0-or-later", "options": [{"name": "Forgejo (or Gitea)", "pros": "One small binary. Built-in registries for Maven, PyPI, Cargo, Go, Conan, npm, containers and Helm. OIDC login.", "cons": "Fewer enterprise controls. Smaller plugin ecosystem."}, {"name": "GitLab CE", "pros": "Code, CI, registry and issues in one product. Very mature CI.", "cons": "Wants 8 GB RAM or more. Many approval and access features sit in paid tiers."}], "gotchas": ["Protect main on day one: one review from someone else plus green CI.", "Git is the source of truth for deployments too, so mirror and back up the forge nightly.", "Datasets and model files do not belong in Git. Use DVC and object storage.", "Forgejo Actions reads GitHub-style workflows, but not every marketplace action works. Keep workflows thin."]}, {"id": "ci", "layer": "CI runners", "job": "Runs the same make targets a developer runs on a Mac, on every push.", "pick": "Forgejo Actions or Woodpecker CI", "licence": "GPL-3.0 / Apache-2.0", "options": [{"name": "Forgejo Actions or Woodpecker", "pros": "Simple, container-native, little to operate.", "cons": "Fewer features than the big engines."}, {"name": "Jenkins", "pros": "Does anything. A plugin exists for everything.", "cons": "Plugin and security upkeep never ends. Groovy pipelines get hard to read."}, {"name": "Tekton or Argo Workflows", "pros": "Kubernetes-native. Good for training jobs shaped like graphs.", "cons": "Verbose YAML and a steep learning curve."}, {"name": "Dagger", "pros": "Pipelines as code that run the same on a Mac and in CI.", "cons": "One more engine to learn and host."}], "gotchas": ["Keep pipeline YAML thin. Logic lives in the Makefile so a Mac and CI run the same commands.", "Pin actions and images by commit SHA or digest, scanners included. In March 2026 hijacked Trivy action tags stole CI secrets and led to poisoned LiteLLM releases on PyPI.", "A runner with the Docker socket mounted is root on its host. Use rootless BuildKit or throwaway runners.", "Proxy and cache dependencies through your own registry, or builds crawl and break when the internet hiccups.", "Latency tests are flaky on shared runners. Give speed gates a dedicated runner with fixed CPU."]}, {"id": "artifacts", "layer": "Images, packages and signatures", "job": "Stores what CI builds, scans it, signs it, and copies it next to each cluster.", "pick": "Harbor plus the forge's package registries", "licence": "Apache-2.0", "options": [{"name": "Harbor", "pros": "Scanning, signing policy, OIDC, and replication to ACR, Artifact Registry and ECR.", "cons": "Several services plus Postgres and Redis to run."}, {"name": "Forge built-in registry only", "pros": "No extra tool.", "cons": "No scanning, admission policy or replication."}, {"name": "Zot", "pros": "Tiny OCI-native registry.", "cons": "Fewer features and a smaller community."}, {"name": "Cloud registries alone", "pros": "Managed and close to the clusters.", "cons": "Three places to manage, and not open source."}], "gotchas": ["Pulling images across clouds costs money and time. Replicate to the registry beside each cluster.", "Deploy by digest, never by tag. A tag can move; a digest cannot.", "Harbor's login mode cannot be switched once users exist. Choose OIDC at install.", "Set retention and garbage collection early or the disk fills."]}, {"id": "security", "layer": "Supply-chain checks", "job": "Finds leaked secrets, risky code and vulnerable dependencies before anything ships.", "pick": "Gitleaks, Opengrep, Syft + Grype or Trivy, cosign, Kyverno, ZAP", "licence": "MIT / LGPL / Apache-2.0", "options": [{"name": "Trivy", "pros": "One tool for images, IaC, SBOMs and secrets.", "cons": "Its releases and actions were compromised in March 2026. Pin exact versions and digests."}, {"name": "Syft + Grype", "pros": "Clean split: build the SBOM once, scan it many times.", "cons": "Two tools instead of one."}, {"name": "SonarQube Community Build", "pros": "Quality gates for many languages in one UI.", "cons": "Branch and pull-request analysis is paid."}], "gotchas": ["Scanners are software too. Pin them and verify them like any other dependency.", "Block criticals that have a fix. Blocking everything stops the line daily and teaches people to bypass it.", "Keep the ignore list in Git with an expiry date on every entry.", "Signing without verifying is theatre. Enforce signatures at admission with Kyverno."]}, {"id": "data", "layer": "Data and object storage", "job": "Versions datasets so any model can be traced to the exact data that trained and tested it.", "pick": "DVC on each cloud's bucket (S3, GCS, Azure Blob)", "licence": "Apache-2.0", "options": [{"name": "DVC", "pros": "Feels like Git. No server. Works with any bucket.", "cons": "No UI. Slow with millions of tiny files."}, {"name": "lakeFS", "pros": "Branch and merge for whole data lakes, with a UI.", "cons": "Another service to run."}, {"name": "Git LFS", "pros": "Simplest possible.", "cons": "Poor at scale, and fills the forge's disk."}], "gotchas": ["MinIO's community edition is no longer maintained (repository archived April 2026). For self-hosted S3 use SeaweedFS, Garage or Ceph RGW.", "Record the dataset hash in every training run. Without it lineage is a guess.", "Golden test sets must be held out and access-controlled, or they leak into training."]}, {"id": "tracking", "layer": "Experiments and model registry", "job": "Remembers every training run and which model version is the champion.", "pick": "MLflow", "licence": "Apache-2.0", "options": [{"name": "MLflow", "pros": "The de facto standard. Tracking, registry and evaluation for any framework.", "cons": "No OIDC in the open-source server. Plain UI."}, {"name": "ClearML", "pros": "Tracking plus orchestration and data management.", "cons": "Heavier server, some open-core parts."}, {"name": "Aim", "pros": "Fast, pleasant run comparison.", "cons": "No model registry."}], "gotchas": ["Put oauth2-proxy in front of MLflow to get SSO.", "Use aliases (champion, candidate). Stages are deprecated.", "Pin the model version in Git for each deployment. Do not resolve an alias at runtime, or rollbacks stop being auditable.", "Back up both halves: metadata in Postgres and artifacts in the bucket."]}, {"id": "evaluation", "layer": "Model testing", "job": "Decides with numbers, not opinions, whether a model may move down the line.", "pick": "pytest golden sets, lm-evaluation-harness or Inspect, Fairlearn, Evidently, garak, k6", "licence": "MIT / Apache-2.0", "options": [{"name": "pytest plus your own golden sets", "pros": "Everyone knows it. Runs the same on a Mac and in CI.", "cons": "You build the metrics and reports yourself."}, {"name": "lm-evaluation-harness or Inspect AI", "pros": "Standard benchmarks and agent-style evaluations.", "cons": "Slow on CPU: run a small subset per commit and the full set nightly."}, {"name": "promptfoo or DeepEval", "pros": "Quick prompt and RAG regression tests.", "cons": "Judge-model costs. promptfoo stays MIT but has belonged to OpenAI since March 2026."}, {"name": "garak or PyRIT", "pros": "Red-team probes: jailbreaks, prompt injection, data leakage.", "cons": "Noisy results that need triage."}], "gotchas": ["Models are not deterministic. Fix seeds and thread counts, and assert within a tolerance band, never equality.", "Test the file you ship. Quantizing to int8 shifts accuracy, so gate the ONNX or GGUF artifact, not the training checkpoint.", "On a Mac force device='cpu', or PyTorch may quietly use MPS and give different numbers from the cloud.", "Thresholds live in Git and change by pull request.", "Two tiers: a smoke suite under two minutes on every commit, the full suite on every candidate."]}, {"id": "serving", "layer": "Model serving on CPU", "job": "Turns a model file into an HTTP service that is fast enough on ordinary CPUs.", "pick": "ONNX Runtime or llama.cpp in a plain container", "licence": "MIT", "options": [{"name": "Plain container (FastAPI + ONNX Runtime)", "pros": "Simplest. Runs the same on Docker, kind and every cloud.", "cons": "You write the batching and health checks."}, {"name": "BentoML", "pros": "Python-first packaging with batching built in.", "cons": "Another abstraction to learn."}, {"name": "KServe", "pros": "Canary, scale to zero, standard inference protocol.", "cons": "More moving parts than small CPU models need."}], "gotchas": ["Seldon Core moved to a BSL licence in 2024 and is no longer open source.", "Kubernetes CPU limits throttle and wreck p95 latency. Set requests equal to limits and match OMP_NUM_THREADS to the request.", "Chips differ per cloud (AVX-512 or AMX on x86, NEON on arm64). Measure latency on each cloud, not once.", "Small models can ship inside the image, so one digest rolls back code and model together."]}, {"id": "infra", "layer": "Infrastructure as code", "job": "Creates the clusters, networks, buckets and identities on each cloud.", "pick": "OpenTofu", "licence": "MPL-2.0", "options": [{"name": "OpenTofu", "pros": "Open source. Drop-in for Terraform code and providers. State encryption built in.", "cons": "The very newest Terraform features can differ."}, {"name": "Terraform", "pros": "Largest ecosystem and documentation.", "cons": "BSL licence, so not open source."}, {"name": "Pulumi", "pros": "Real programming languages.", "cons": "A different model plus a state service."}, {"name": "Crossplane", "pros": "Kubernetes-native control plane.", "cons": "Steep, and needs a cluster before it can build one."}], "gotchas": ["Remote state with locking, one state per cloud per environment. Never local state.", "OpenTofu builds the cluster and installs Argo CD, then stops. Do not manage in-cluster apps with it.", "There is no real rollback: you revert and apply. Guard stateful resources with prevent_destroy and backups.", "Pin provider versions and commit the lock file.", "Keep Kubernetes minor versions aligned across AKS, GKE and EKS."]}, {"id": "config", "layer": "Machines, scripts and cloud CLIs", "job": "Sets up Macs, runners and the Docker host, and hides three cloud CLIs behind one command.", "pick": "Ansible, shell, and az / gcloud / aws behind factoryctl", "licence": "GPL-3.0", "options": [{"name": "Ansible", "pros": "Agentless and readable. Good for Macs, runners and VMs.", "cons": "Slow across many hosts. Logic in YAML gets ugly."}, {"name": "Shell scripts", "pros": "No dependencies.", "cons": "Hard to keep idempotent. Use set -euo pipefail and shellcheck."}, {"name": "Packer images", "pros": "Immutable and fast to boot.", "cons": "Every change means a rebuild."}], "gotchas": ["Ansible is not for deploying apps to Kubernetes. That is GitOps' job.", "kubectl login differs per cloud: AKS needs kubelogin, GKE needs gke-gcloud-auth-plugin, EKS uses aws eks get-token. Wrap all three.", "Pin CLI versions with a Brewfile and mise so every Mac and runner matches."]}, {"id": "delivery", "layer": "GitOps and safe rollout", "job": "Makes each cluster match what Git says, and rolls back when numbers go bad.", "pick": "Argo CD and Argo Rollouts, Helm + Kustomize", "licence": "Apache-2.0", "options": [{"name": "Argo CD", "pros": "Clear UI, SSO, roles by group.", "cons": "A central hub needs network paths and credentials into every cluster."}, {"name": "Flux", "pros": "Pull-only and light. No inbound access needed.", "cons": "Minimal UI."}, {"name": "helm upgrade from CI", "pros": "Simplest.", "cons": "No drift detection, and CI holds cluster credentials."}], "gotchas": ["With auto-sync on, 'argocd app rollback' is refused. Roll back with git revert.", "One Argo CD per cluster, pulling from Git, avoids a hub that holds the keys to every cloud.", "ingress-nginx was retired in March 2026. Use a Gateway API implementation such as Envoy Gateway, Traefik or Cilium.", "Bitnami stopped publishing free versioned images and charts in August 2025. Use upstream charts and operators such as CloudNativePG."]}, {"id": "secrets", "layer": "Secrets", "job": "Keeps passwords and keys out of Git and out of CI variables.", "pick": "External Secrets Operator with each cloud's secret manager; SOPS + age for Git", "licence": "Apache-2.0 / MPL-2.0", "options": [{"name": "External Secrets + cloud secret managers", "pros": "No vault to run. Uses workload identity.", "cons": "Three backends to understand."}, {"name": "SOPS + age", "pros": "Encrypted secrets in Git. Very simple.", "cons": "You distribute keys by hand. No rotation or audit trail."}, {"name": "OpenBao", "pros": "Open-source fork of Vault: dynamic secrets and auditing.", "cons": "One more highly-available service."}], "gotchas": ["CI reaches each cloud through workload identity. Store no long-lived cloud keys.", "Workload identity comes in three flavours (AKS Workload Identity, GKE Workload Identity Federation, EKS Pod Identity). Hide them behind module outputs.", "HashiCorp Vault is BSL-licensed. OpenBao is the open-source line."]}, {"id": "observability", "layer": "Metrics, logs and drift", "job": "Shows whether services and models are healthy, and wakes someone when they are not.", "pick": "Prometheus, Grafana, Loki, OpenTelemetry, Evidently", "licence": "Apache-2.0 / AGPL-3.0", "options": [{"name": "Prometheus + Grafana + Loki", "pros": "The standard. Dashboards exist for everything.", "cons": "Grafana and Loki are AGPL: fine to use, relevant if you modify and resell."}, {"name": "VictoriaMetrics", "pros": "Lighter, with cheaper long-term storage.", "cons": "Smaller community."}, {"name": "SigNoz", "pros": "Metrics, logs and traces in one product.", "cons": "Younger project."}], "gotchas": ["Grafana OSS maps roles from OIDC claims, but team sync is an enterprise feature.", "Run one metrics stack per cluster and remote-write to the hub. Never scrape across clouds.", "Model quality and drift are production metrics. Alert on them exactly like error rates."]}, {"id": "knowledge", "layer": "Portal, docs and chat", "job": "Lets one team find, understand and reuse what another team built.", "pick": "A static portal first, MkDocs + ADRs in Git, Zulip", "licence": "Apache-2.0", "options": [{"name": "Static portal (like this one)", "pros": "Hours to set up and nothing to patch.", "cons": "No templates or scorecards engine."}, {"name": "Backstage", "pros": "Catalog, templates, docs and plugins.", "cons": "It is a framework you build and upgrade, so it needs a TypeScript owner. Worth it past roughly 50 services."}, {"name": "Wiki.js or BookStack", "pros": "Friendly editing for everyone.", "cons": "Docs drift away from the code."}], "gotchas": ["Mattermost's free edition has no generic OIDC login. Zulip does.", "Keep docs beside the code, or they rot.", "Put an owner file in every repo from day one."]}, {"id": "localdev", "layer": "Local development on macOS", "job": "Gives every developer the same tools and a small copy of the platform on a laptop.", "pick": "Brewfile, mise, Colima, kind, devcontainers, pre-commit", "licence": "MIT / Apache-2.0", "options": [{"name": "Colima", "pros": "Free, light, command-line.", "cons": "No GUI."}, {"name": "Podman Desktop or Rancher Desktop", "pros": "GUI, with Kubernetes built in.", "cons": "Occasional compatibility quirks."}, {"name": "Docker Desktop", "pros": "Smoothest experience.", "cons": "Paid licence for larger companies, and not open source."}], "gotchas": ["Apple Silicon is arm64 and most cloud nodes are amd64. Build multi-arch images; emulating amd64 on a Mac is slow.", "arm64 cloud nodes (Graviton, Cobalt, Axion) match the Mac and cost less. Worth a staging pool.", "kind is not a cloud: no real load balancers, storage classes or IAM. Staging on real clusters stays mandatory."]}]}</script>
<script>
(function () {
  'use strict';
  var view = document.getElementById('view');
  var raw = document.getElementById('factory-data').textContent.trim();
  if (!raw || raw.indexOf('__FACTORY') === 0) {
    view.innerHTML = '<h1>No factory data yet</h1><p class="lede">This is the empty template. Run <code>python3 factory_sim.py run</code>, then open <code>site/index.html</code>.</p>';
    return;
  }
  var D = JSON.parse(raw);
  var state = { user: 'lea', auditTool: '', auditResult: '' };

  var STATIONS = [
    ['code', 'Code', 'Forgejo'], ['build', 'Build and test', 'CI runners'], ['scan', 'Scan and sign', 'Harbor, Grype, cosign'],
    ['train', 'Train', 'DVC, MLflow'], ['evaluate', 'Evaluate', 'Gates kept in Git'], ['register', 'Register', 'MLflow registry'],
    ['deploy', 'Deploy', 'Argo CD, Rollouts'], ['observe', 'Observe', 'Prometheus, Grafana']
  ];
  var SERVICES = [['floor', 'Floor plan'], ['access', 'Sign-in and access'], ['infra', 'Infrastructure'],
                  ['share', 'Shared knowledge'], ['audit', 'Audit trail'], ['options', 'Tool options']];
  var PLAN = [
    ['People', 'Developers on macOS with a Brewfile, mise, Colima, kind and devcontainers. The same make targets run on the laptop and in CI.'],
    ['Sign-in', 'Keycloak. One login, one token, and the groups inside it become roles in every tool below.'],
    ['Share', 'This portal, MkDocs and decision records in Git, Zulip for chat. Every repo names its owner.'],
    ['The line', 'Forgejo, CI runners, Harbor with scanners and signing, DVC and MLflow, evaluation gates, Argo CD with Rollouts.'],
    ['Targets', 'mac-kind, docker-dev, then staging and prod on AKS, GKE and EKS. Same manifests everywhere.'],
    ['Foundations', 'OpenTofu per cloud, Ansible for Macs and hosts, factoryctl over az, gcloud and aws, External Secrets.'],
    ['Watch', 'Prometheus, Grafana, Loki, OpenTelemetry, Evidently for drift, and one audit trail across all tools.']
  ];
  var ACTIONS = {
    merge: { perm: 'pr:merge', label: 'Merge a pull request', cmds: ['factoryctl pr merge inference-engine 1', '# Forgejo checks branch protection first: one approval from someone else, and green CI'] },
    train: { perm: 'model:train', label: 'Start a training run', cmds: ['make train DATA=support-tickets:1.2', '# runs as a Kubernetes Job on 8 vCPU and logs params, metrics and the ONNX file to MLflow'] },
    champion: { perm: 'model:promote', label: 'Promote a candidate to champion', cmds: ['factoryctl model promote ' + D.meta.model + ' ' + D.champion, '# sets the MLflow alias, then opens a pull request that pins the version in environments/prod'] },
    prod: { perm: 'deploy:prod', label: 'Promote to production', cmds: ['factoryctl promote ' + D.meta.model + ' ' + D.champion + ' --env prod', '# opens a pull request against environments/prod; after merge Argo Rollouts runs the 10, 50, 100 percent canary'] },
    rollback: { perm: 'deploy:prod', label: 'Roll back production', cmds: ['factoryctl rollback ' + D.meta.model + ' --env prod', '# = git revert <environments commit> && git push; Argo CD syncs the previous digest within a minute'] },
    apply: { perm: 'infra:apply', label: 'Apply an infrastructure change', cmds: ['tofu -chdir=infra/live/aws/staging plan -out plan.bin', 'tofu -chdir=infra/live/aws/staging apply plan.bin'] },
    offboard: { perm: 'access:manage', label: 'Offboard a user', cmds: ['factoryctl offboard sam', '# disables the Keycloak account, then removes SSH keys, tokens, robot secrets and cloud bindings in every tool'] }
  };

  // ---------- helpers ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var GOOD = ['ok', 'passed', 'pushed', 'merged', 'Healthy', 'Synced', 'promoted', 'ready', 'champion', 'candidate', 'resolved', 'active', 'deploy', 'accepted'];
  var BAD = ['failed', 'denied', 'blocked', 'aborted', 'rejected', 'disabled', 'critical'];
  var WARN = ['flaky', 'warning', 'rolled back', 'rollback', 'open alert'];

    },
    options: function () {
      return head('Tool options', 'For each job on the floor: the default pick, the alternatives with pros and cons, and the gotchas. All open source. Scope: CPU only, small models.', []) +
        D.catalog.map(function (c) {
          return '<details class="opt"><summary><strong>' + esc(c.layer) + '</strong><span class="muted">' + esc(c.pick) + '</span></summary><p>' + esc(c.job) + ' Licence: ' + esc(c.licence) + '.</p>' +
            table([{ h: 'Option', f: function (o) { return '<strong>' + esc(o.name) + '</strong>'; } }, { h: 'Pros', k: 'pros' }, { h: 'Cons', k: 'cons' }], c.options, true) +
            '<h3>Gotchas</h3><ul>' + c.gotchas.map(function (g) { return '<li>' + esc(g) + '</li>'; }).join('') + '</ul></details>';
        }).join('');
    }
  };

  // ---------- shell ----------
  function current() { var id = location.hash.replace('#', ''); return views[id] ? id : 'floor'; }
  function render() {
    var id = current();
    document.getElementById('line').innerHTML = STATIONS.map(function (s, i) {
      var st = D.line[s[0]];
      return '<a class="station" href="#' + s[0] + '"' + (s[0] === id ? ' aria-current="page"' : '') + '><span class="n">' + (i + 1) + '</span><span class="name">' + esc(s[1]) + '</span><span class="tool">' + esc(s[2]) +
        '</span><span class="stat"><span class="lamp ' + st.lamp + '"></span>' + esc(st.text) + '</span></a>';
    }).join('');
    document.getElementById('services').innerHTML = SERVICES.map(function (s) { return '<a href="#' + s[0] + '"' + (s[0] === id ? ' aria-current="page"' : '') + '>' + esc(s[1]) + '</a>'; }).join('');
    view.innerHTML = views[id]();
    var active = document.querySelector('.station[aria-current="page"]');
    if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  var who = document.getElementById('who');
  who.innerHTML = D.users.map(function (u) { return '<option value="' + esc(u.id) + '"' + (u.id === state.user ? ' selected' : '') + '>' + esc(u.id + ', ' + u.role + (u.active ? '' : ' (disabled)')) + '</option>'; }).join('');
  who.addEventListener('change', function () { state.user = who.value; render(); });
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });
  document.addEventListener('change', function (e) { var k = e.target.getAttribute && e.target.getAttribute('data-filter'); if (k) { state[k] = e.target.value; render(); } });
  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b) return;
    var a = ACTIONS[b.getAttribute('data-act')], u = me(), ok = can(a.perm), dlg = document.getElementById('dlg');
    dlg.className = ok ? '' : 'denied';
    document.getElementById('dlg-title').textContent = ok ? 'Allowed: ' + a.label.toLowerCase() : 'Denied: ' + a.label.toLowerCase();
    document.getElementById('dlg-body').innerHTML = ok
      ? '<p>' + esc(u.id) + ' is a ' + esc(u.role) + ' and holds <code>' + esc(a.perm) + '</code>. On the real floor this runs:</p><pre>' + esc(a.cmds.join('\n')) + '</pre>'
      : '<p>' + esc(u.id) + (u.active ? ' is a ' + esc(u.role) + ', and that role lacks ' : ' is disabled and no longer holds ') + '<code>' + esc(a.perm) + '</code>. The attempt is written to the audit trail.</p><p>To get access, open a pull request against <code>access/groups.yaml</code>. A maintainer of the owning team reviews it.</p>';
    if (dlg.showModal) dlg.showModal(); else alert(document.getElementById('dlg-title').textContent);
  });
  render();
})();
</script>
</body>
</html>
