apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: factory-simulator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://git.example.invalid/platform/environment-config.git
    targetRevision: main
    path: apps/factory-simulator/overlays/test
  destination:
    server: https://kubernetes.default.svc
    namespace: ai-factory
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
      - RespectIgnoreDifferences=true
  revisionHistoryLimit: 10

