apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: factory-component
  namespace: ai-factory-ci
spec:
  description: Build, test, evaluate, and record evidence for a component. Source must already be present in the workspace.
  params:
    - name: project
      type: string
    - name: profile
      type: string
      description: python-ai, java, cpp, go, rust, or web
    - name: source-revision
      type: string
    - name: image
      type: string
      description: Immutable destination without a mutable latest tag
  workspaces:
    - name: source
    - name: evidence
  tasks:
    - name: validate-contract
      params:
        - name: project
          value: $(params.project)
        - name: revision
          value: $(params.source-revision)
      taskSpec:
        params:
          - name: project
          - name: revision
        workspaces:
          - name: source
        steps:
          - name: validate
            image: alpine:3.22
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -eu
              test -n "$(params.project)"
              test -n "$(params.revision)"
              test -f OWNERS || { echo "OWNERS file is required"; exit 1; }
    - name: test
      runAfter: [validate-contract]
      params:
        - name: profile
          value: $(params.profile)
      taskSpec:
        params:
          - name: profile
        workspaces:
          - name: source
          - name: evidence
        steps:
          - name: tests
            image: python:3.13-alpine
            workingDir: $(workspaces.source.path)
            script: |
              #!/bin/sh
              set -eu
              echo "Replace this adapter with a pinned internal builder for profile $(params.profile)."
              printf '{"profile":"%s","status":"adapter-required"}\n' "$(params.profile)" > $(workspaces.evidence.path)/tests.json
    - name: supply-chain
      runAfter: [test]
      taskSpec:
        workspaces:
          - name: source
          - name: evidence
        steps:
          - name: evidence-contract
            image: alpine:3.22
            script: |
              #!/bin/sh
              set -eu
              test -f $(workspaces.evidence.path)/tests.json
              echo "Production adapter: generate SBOM, scan, build rootlessly, sign, and attach provenance."
  finally:
    - name: summary
      taskSpec:
        steps:
          - name: result
            image: alpine:3.22
            script: |
              #!/bin/sh
              echo "Pipeline finished for $(params.project) at $(params.source-revision)"

