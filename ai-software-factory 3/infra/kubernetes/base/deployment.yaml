apiVersion: apps/v1
kind: Deployment
metadata:
  name: factory-simulator
  namespace: ai-factory
  labels:
    app.kubernetes.io/name: factory-simulator
    app.kubernetes.io/part-of: ai-software-factory
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: factory-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: factory-simulator
        app.kubernetes.io/part-of: ai-software-factory
    spec:
      serviceAccountName: factory-simulator
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: simulator
          image: registry.example.invalid/ai-software-factory-simulator:replace-with-digest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: FACTORY_HOST
              value: "0.0.0.0"
            - name: FACTORY_PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi

